<!DOCTYPE html>
<html lang="nb-NO">

<head>

  <title>Tømmekalender</title>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/condo.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

  <!-- table container for all tables -->
  <div class="tableContainer">

    <!-- show vertical menu -->
    <div class="menuVertical"></div>
    
    <!-- show main menu -->
    <div class="menuMain"></div>

    <!-- show empty calendar menu -->
    <div class="menuEmptyingCalendar"></div>

    <!-- show header -->
    <div class="showHeader"></div>

    <!-- show filter -->
    <div class="showFilter"></div>

    <!-- show emptyingcalendars -->
    <div class="showEmptyingCalendars"></div>

    <!-- show message -->
    <div class="showMessage"></div>
  </div>

  <script src="classes/condo-class.js"></script>
  <script src="classes/condo-user-class.js"></script>
  <script src="classes/condo-condo-class.js"></script>
  <script src="classes/condo-emptyingcalendars-class.js"></script>
  <script src="scripts/condo-emptyingcalendars.js"></script>

</body>

</html>
