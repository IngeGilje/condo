    <div class="field field-position">
      <label>
        Fra Dato
      </label>
      <input type="date" style="height: 52px;" class="filterFromDate center one-line input" value="2026-07-01">
    </div>
    <div class="field field-position">
      <label>
        Til Dato
      </label>
      <input type="date" style="height: 52px;" class="filterToDate center one-line input" value="2026-08-25">
    </div>
    <div class="field field-position">
      <label>
        Beløp
