<!DOCTYPE html>
<html lang="nb-NO">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bilag</title>

  <link rel="stylesheet" href="styles/main.css">
</head>

<body>

  <!-- start startContent -->
  <section class="card">
    <h2 class="card-title">
      Transaksjonsdetaljer
    </h2>
    <form>
      <div class="grid grid-form">
        <!-- end startContent -->

        <!-- start inputDate -->
        <div class="field">
          <label for="date">
            Dato
          </label>
          <input class="newsDate" id="date" type="date" value="2026-08-20" readonly>
        </div>
        <!-- end inputDate -->
        <div></div>
        <!-- start showSelectedUsersNew -->
        <div class="field">
          <label for="apartment">
            Forfatter
          </label>
          <select id="apartment" class="userId">

            <option value=9>
              Åse
            </option>
            <option value=3>
              Fabiana
            </option>
            <option value=2>
              Inge
            </option>
            <option value=5>
              Kristine
            </option>
            <option value=7>
              Ladan
            </option>
            <option value=8 selected>
              Oskar
            </option>
          </select>
        </div>
        <!-- end showSelectedUsersNew -->

        <!-- start inputWideText -->
        <div class="field wide">
          <label for="title">
            Tittel
          </label>
          <input class="title" id="title" value="Programmering av fjernkontroll til garasje" readonly>
        </div>
        <!-- end inputWideText -->


        <!-- start endContent -->
      </div>
    </form>
  </section>
  <!-- end endContent -->

  <!-- start startButtons -->
  <div class="actions">
    <!-- end startButtons -->

    <!-- start inputButton -->
    <button class="update primary" type="submit">
      Oppdater
    </button>
    <!-- end inputButton -->

    <!-- start inputButton -->
    <button class="insert secondary" type="button">
      Ny
    </button>
    <!-- end inputButton -->

    <!-- start inputButton -->
    <button class="cancel secondary" type="reset">
      Angre
    </button>
    <!-- end inputButton -->

    <!-- start inputButton -->
    <button class="back secondary" type="button">
      Tilbake
    </button>
    <!-- end inputButton -->

    <!-- start inputButton -->
    <button class="delete danger" type="button">
      Slett
    </button>
    <!-- end inputButton -->

    <!-- start endButtons -->
  </div>
  <!-- end endButtons -->
</body>

</html>
