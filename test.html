<!DOCTYPE html>
<html lang="nb-NO">

<head>
  <title>Bankontotransaksjoner</title>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/condo.css">
  <link rel="stylesheet" href="styles/condo.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

  <!-- start startBoxFilter -->
  <div class="filter-grid">
    <!-- end startBoxFilter -->

    <!-- start showGridCondos -->
    <div class="filter-field">
      <div class="grid">
        <div class="field">
          <label for="filterCondoId">
            Leilighet
          </label>
          <select id="filterCondoId" class="filterCondoId">

            <option value=3>
              95A
            </option>
            <option value=4>
              95B
            </option>
            <option value=5>
              97A
            </option>
            <option value=6>
              97B
            </option>
            <option value=7>
              97C
            </option>
            <option value=8>
              99A
            </option>
            <option value=9>
              99B
            </option>
            <option value=999999998 selected>
              Vis alle
            </option>
          </select>
        </div>
      </div>
    </div>
    <!-- end showGridCondos -->

    <!-- start showSelectedAccountsNew -->
    <div class="field">
      <label for="filterAccountId">
        Konto
      </label>
      <select id="filterAccountId" class="filterAccountId">

        <option value=13>
          1,2,3,4... transaksjoner
        </option>
        <option value=67>
          Diverse
        </option>
        <option value=6>
          Forsikring
        </option>
        <option value=10>
          Gebyr - FAKT.TJ
        </option>
        <option value=56>
          Inntekt drift
        </option>
        <option value=4>
          Inntekt fjernvarme
        </option>
        <option value=2>
          Inntekter husleie
        </option>
        <option value=5>
          Nettleie Lyse
        </option>
        <option value=52>
          Omkostninger BedriftsNett
        </option>
        <option value=8>
          TV og bredbånd
        </option>
        <option value=9>
          Ugift drift
        </option>
        <option value=3>
          Utgift fjernvarme
        </option>
        <option value=22>
          Velforening
        </option>
        <option value=999999998 selected>
          Vis alle
        </option>
      </select>
    </div>
    <!-- end showSelectedAccountsNew -->

    <!-- start inputLineFilterDate -->
    <div class="filter-field">
      <div class="grid">
        <div class="field">
          <label for="filterFromDate">
            Fra Dato
          </label>
          <input type="date" class="filterFromDate" id="filterFromDate" value="2026-08-01">
        </div>
      </div>
    </div>
    <!-- end inputLineFilterDate -->

    <!-- start inputLineFilterDate -->
    <div class="filter-field">
      <div class="grid">
        <div class="field">
          <label for="filterToDate">
            Til Dato
          </label>
          <input type="date" class="filterToDate" id="filterToDate" value="2026-09-25">
        </div>
      </div>
    </div>
    <!-- end inputLineFilterDate -->

    <!-- start inputLineFilterText -->
    <div class="filter-field">
      <div class="grid">
        <div class="field">
          <label for="filterAmount">
            Beløp
          </label>
          <input type="text" maxlength="11" class="filterAmount" id="filterAmount" value="0,00">
        </div>
      </div>
    </div>
    <!-- end inputLineFilterText -->

  </div>
  <!-- end endBoxFilter -->
</body>

</html>
