<!DOCTYPE html>
<html lang="nb-NO">

<head>
  <title>Tabell</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/condo.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

</head>

<body>

  <main class="page">
    <div class="content-layout">

      <!-- start startContent -->
      <section class="card">
        <h2 class="card-title">
          Fjernvarme
        </h2>
        <form>
          <div class="grid grid-form">
            <!-- end startContent -->

            <!-- start startLine -->
            <div class="line">
              <!-- end startLine -->

              <!-- start inputDate -->
              <div class="field">
                <label for="remoteHeatingDate">
                  Dato
                </label>
                <input type="date" class="remoteHeatingDate" id="remoteHeatingDate" value="2021-02-15">
              </div>
              <!-- end inputDate -->
            </div>
            <div></div>
            <div></div>
            <!-- start startLine -->
            <div class="line">
              <!-- end startLine -->

              <!-- start showSelectedCondosNew -->
              <div class="field">
                <label for="condoId">
                  Leilighet
                </label>
                <select id="condoId" class="condoId">

                  <option value=3>
                    95A
                  </option>
                  <option value=4>
                    95B
                  </option>
                  <option value=5 selected>
                    97A
                  </option>
                  <option value=6>
                    97B
                  </option>
                  <option value=7>
                    97C
                  </option>
                  <option value=8>
                    99A
                  </option>
                  <option value=9>
                    99B
                  </option>
                </select>
              </div>
              <!-- end showSelectedCondosNew -->
            </div>
            <div></div>
            <div></div>
            <!-- start startLine -->
            <div class="line">
              <!-- end startLine -->

              <!-- start showTextNew -->
              <div class="field field-position">
                <input type="text" autocomplete="off" class="kilowattHour center one-line" value="75 665,00"
                  placeholder="Kontonavn">
                <label>
                  K.timer
                </label>
              </div>
              <!-- end showTextNew -->

              <!-- start showTextNew -->
              <div class="field field-position">
                <input type="text" autocomplete="off" class="priceYear center one-line" value="4 404,00"
                  placeholder="Beløp">
                <label>
                  Beløp
                </label>
              </div>
              <!-- end showTextNew -->
            </div>
            <div></div>
            <!-- start endContent -->
          </div>
        </form>
      </section>
      <!-- end endContent -->

      <!-- start startButtons -->
      <div class="actions">
        <!-- end startButtons -->

        <!-- start inputButton -->
        <button class="update primary" type="submit">
          Oppdater
        </button>
        <!-- end inputButton -->

        <!-- start inputButton -->
        <button class="insert secondary" type="button">
          Ny
        </button>
        <!-- end inputButton -->

        <!-- start inputButton -->
        <button class="cancel secondary" type="reset">
          Angre
        </button>
        <!-- end inputButton -->

        <!-- start inputButton -->
        <button class="back secondary" type="button">
          Tilbake
        </button>
        <!-- end inputButton -->

        <!-- start inputButton -->
        <button class="delete danger" type="button">
          Slett
        </button>
        <!-- end inputButton -->

        <!-- start endButtons -->
      </div>
      <!-- end endButtons -->
    </div>
  </main>

</body>

</html>
